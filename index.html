<!DOCTYPE html>
<html lang="zh-tw">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="https://www.gravatar.com/avatar/c87cbee0a4a96655bd7366b56be7a18a">
    <title>littlechin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css">
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
            history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VGDKRYEE2D"></script>
    <script>
      (function () {
        const redirectUrl = 'https://www.instagram.com/littlechinright'

        window.dataLayer = window.dataLayer || []
        function gtag() { dataLayer.push(arguments) }
        window.gtag = gtag
        gtag('js', new Date())
        gtag('config', 'G-VGDKRYEE2D', { send_page_view: true })

        const redirectNow = () => window.location.replace(redirectUrl)
        const fallbackTimer = setTimeout(redirectNow, 1200)

        gtag('event', 'redirect_to_instagram', {
          event_category: 'navigation',
          event_label: redirectUrl,
          transport_type: 'beacon',
          event_callback: () => {
            clearTimeout(fallbackTimer)
            redirectNow()
          }
        })
      })()
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0;url=https://www.instagram.com/littlechinright">
      <strong>正在跳轉到 Instagram：<a href="https://www.instagram.com/littlechinright">https://www.instagram.com/littlechinright</a></strong>
    </noscript>
  </body>
</html>
